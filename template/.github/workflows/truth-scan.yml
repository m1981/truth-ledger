# .github/workflows/truth-scan.yml
#
# The heartbeat. It has been through two contractions, and both removed a
# WRITER rather than adding a check.
#
# It began as one part: run `invalidate-scan` after every push and commit
# the resulting invalidation records back. That scan asked a SYNTACTIC
# question -- did this push touch a path some claim watches -- and on the
# template's own ledger it answered yes 1997 times against 71 judged
# divergences. Positive predictive value 3.6%, and every false alarm was a
# committed record a human then had to read. The Reproduce-on-Read refactor
# (steps 2.4-2.6) retired that proxy and left two parts: reproduce, and a
# `ttl-scan` that still wrote.
#
# ADR-057 removed the second. TTL expiry is a READ-TIME DERIVATION now --
# the fold computes it from (claim ts, ttl_days, now) -- so there is
# nothing to append, nothing to commit, and nobody to attribute it to. What
# this job does today:
#
#   REPRODUCE (blocking, writes nothing). Re-runs every LIVE claim's
#   recorded evidence capsule here and now and asks the SEMANTIC question:
#   does it still produce what it produced? Measured cost ~8ms per capsule.
#   It fails the job on exit 7 (a capsule no longer reproduces -- a human
#   must judge it, and ADR-012 says a machine must not decide
#   mechanical-vs-genuine) and on exit 8 (the sweep examined ZERO claims,
#   which is a failure and never a pass, ADR-042 rule 2).
#
#   REPORT (never blocking, writes nothing). Prints what the clock says is
#   expired, so expiry stays VISIBLE. This is the half that used to be
#   done by committing records, and losing it would have been the real
#   cost of ADR-057: a derived status nobody surfaces is a status nobody
#   acts on. The job summary is now the surface.
#
# WHAT WENT AWAY WITH THE WRITER, and each of these was a liability:
#   * `permissions: contents: write` -- this job can no longer alter the
#     repository it audits. An L1 instrument that can commit to the branch
#     it measures is exactly the L1/L2 leak the layer exists to refuse.
#   * the `truth-scanner[bot]` identity, its commit, and its push.
#   * the [skip ci] / actor guard that stopped the bot re-triggering
#     itself. No write, no loop, no guard.
#   * the per-branch concurrency queue, which existed so two rapid merges
#     could not race on the append. Reads do not race.

name: truth-scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: capsules may read it

      - name: Reproduce every live capsule (blocking, files nothing)
        run: python3 scripts/truth reproduce

      - name: Surface what the clock has expired (visibility, not silence)
        # Never blocks: an expiry is a fact to re-verify, not a defect in
        # the push that happened to reveal it (EPI-305 -- the machine
        # measures, the human judges). It reports the COUNT even when zero,
        # because a section that only ever appears on bad news is
        # indistinguishable from a section that stopped working.
        if: always()
        run: |
          set -eu
          {
            echo "## Facts expired by the clock (ADR-019, derived at read time)"
            python3 scripts/truth list --stale --json \
              | python3 -c "
import json, sys
rows = json.load(sys.stdin)
if not rows:
    print('None. Every TTL-bearing claim is inside its shelf life.')
for r in rows:
    print('- \`' + r['id'] + '\` — ' + (r.get('text') or ''))
print()
print('%d claim(s) stale. Nothing was written to the ledger to say so.' % len(rows))
"
          } >> "$GITHUB_STEP_SUMMARY"
